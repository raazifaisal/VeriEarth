[project]
name = "veriearth-backend"
version = "0.1.0"
description = ""
package-mode = false
authors = [
    {name = "Raazi Faisal",email = "raazi.faisal@gmail.com"}
]
license = {text = "GNU"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google (>=3.0.0,<4.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "dotenv (>=0.9.9,<0.10.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "fpdf (>=1.7.2,<2.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "earthengine-api (>=1.5.5,<2.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "pyjwt (>=2.10.1,<3.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "passlib (>=1.7.4,<2.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "sqlalchemy (>=2.0.38,<3.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "fastapi-mail (>=1.4.2,<2.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "pydantic (>=2.10.6,<3.0.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "fastapi (>=0.115.11,<0.116.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "httpx (>=0.28.1,<0.29.0) ; python_version >= \"3.13\" and python_version < \"4.0\"",
    "uvicorn (>=0.34.0,<0.35.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "google-generativeai (>=0.8.4,<0.9.0)",
    "bcrypt (>=4.3.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
